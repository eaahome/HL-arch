services:
  rabbit:
    image: rabbitmq:management
    container_name: rabbit
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypassword
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - rabbit-net
    restart: unless-stopped

networks:
  rabbit-net:
    driver: bridge
